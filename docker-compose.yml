services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./config:/app/config          # 配置可热更新
      - kb_data:/app/knowledge_base    # 持久化知识库
      - uploads:/app/uploads           # 上传文件
      - output:/app/output             # 生成报告
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  kb_data:
  uploads:
  output:
