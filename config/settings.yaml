models:
  deepseek-chat:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
  deepseek-reasoner:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-reasoner
    api_key_env: DEEPSEEK_API_KEY
  qwen-plus:
    provider: dashscope
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    api_key_env: DASHSCOPE_API_KEY
  qwen-turbo:
    provider: dashscope
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-turbo
    api_key_env: DASHSCOPE_API_KEY
  glm-5:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-5
    api_key_env: ZHIPU_API_KEY
  glm-4-plus:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-4-plus
    api_key_env: ZHIPU_API_KEY
  glm-4-flash:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-4-flash
    api_key_env: ZHIPU_API_KEY
  glm-4-flash-250414:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-4-flash-250414
    api_key_env: ZHIPU_API_KEY
  glm-4-air-250414:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-4-air-250414
    api_key_env: ZHIPU_API_KEY
  glm-z1-flash:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-z1-flash
    api_key_env: ZHIPU_API_KEY
  glm-z1-air:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-z1-air
    api_key_env: ZHIPU_API_KEY
  gpt-4o:
    provider: openai
    base_url: https://api.openai.com/v1
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
  o4-mini:
    provider: openai
    base_url: https://api.openai.com/v1
    model: o4-mini
    api_key_env: OPENAI_API_KEY
  claude-sonnet:
    provider: anthropic
    base_url: https://api.anthropic.com/v1
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
agent_models:
  parser: glm-5
  analyzer: glm-5
  synthesizer: glm-5
  generator: glm-5
  reviewer: glm-5
  outline: glm-5
  writer: glm-5
  citation: glm-5
  research: glm-5
  polish: glm-5
  reader: glm-4-plus
  reader_agent: glm-4-plus
  reader_suggestions: glm-4-flash
  paper_search: glm-4-plus
pipeline:
  max_review_retries: 2
  output_dir: ./output
  max_concurrency: 3
  batch_max_concurrency: 5
paper:
  output_dir: ./output/papers
  max_section_tokens: 8192
knowledge_base:
  db_path: ./knowledge_base/research.db
search_providers:
  semantic_scholar:
    base_url: https://api.semanticscholar.org/graph/v1
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
    enabled: true
    timeout: 10
    max_results: 5
  openalex:
    base_url: https://api.openalex.org
    api_key_env: OPENALEX_EMAIL
    enabled: true
    timeout: 10
    max_results: 5
  arxiv:
    base_url: https://export.arxiv.org/api
    api_key_env: ''
    enabled: true
    timeout: 15
    max_results: 5
  pubmed:
    base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
    api_key_env: NCBI_API_KEY
    enabled: true
    timeout: 15
    max_results: 5
  biorxiv:
    base_url: https://www.ebi.ac.uk/europepmc/webservices/rest
    api_key_env: ''
    enabled: true
    timeout: 15
    max_results: 5
  crossref:
    base_url: https://api.crossref.org
    api_key_env: CROSSREF_EMAIL
    enabled: true
    timeout: 15
    max_results: 5
analysis_modes:
  quick:
    label_zh: 快速摘要
    label_en: Quick Summary
    description_zh: 快速提取核心要点，适合快速了解文档大意
    description_en: Quickly extract key points for a high-level overview
    analyzer_prompt: config/prompts/analyzer_quick.txt
    generator_prompt: config/prompts/generator_quick.txt
    skip_review: true
    max_text_length: 4000
  standard:
    label_zh: 标准分析
    label_en: Standard Analysis
    description_zh: 全面深度分析，含方法论评估和贡献评价
    description_en: Comprehensive analysis with methodology assessment
    analyzer_prompt: config/prompts/analyzer_system.txt
    generator_prompt: config/prompts/generator_system.txt
    skip_review: false
    max_text_length: 8000
  deep:
    label_zh: 深度研究
    label_en: Deep Research
    description_zh: 最详尽的分析，适合重点论文的深入解读
    description_en: Most thorough analysis for in-depth study of key papers
    analyzer_prompt: config/prompts/analyzer_deep.txt
    generator_prompt: config/prompts/generator_deep.txt
    skip_review: false
    max_text_length: 16000
  meeting:
    label_zh: 会议报告
    label_en: Meeting Report
    description_zh: 面向组会汇报的结构化报告格式
    description_en: Structured report format for group meeting presentations
    analyzer_prompt: config/prompts/analyzer_system.txt
    generator_prompt: config/prompts/meeting_report.txt
    skip_review: false
    max_text_length: 8000
reader:
  upload_dir: ./uploads/reader
  prompt_template: config/prompts/reader_assistant.txt
  context_strategy: smart
  context_pages: 1
  context_search_limit: 5
  max_chat_history: 20
  suggestions_model: glm-4-flash
  suggestions_count: 3
  suggestions_min_content: 50
  suggestions_prompt: config/prompts/reader_suggestions.txt
  agent_model: glm-4-plus
  agent_max_iterations: 5
api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
  - http://localhost:5173
  - http://localhost:3000
  upload_dir: ./uploads
  max_upload_size: 52428800
