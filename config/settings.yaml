models:
  deepseek-chat:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
  deepseek-reasoner:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-reasoner
    api_key_env: DEEPSEEK_API_KEY
  qwen-plus:
    provider: dashscope
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    api_key_env: DASHSCOPE_API_KEY
  qwen-turbo:
    provider: dashscope
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-turbo
    api_key_env: DASHSCOPE_API_KEY
  glm-4-plus:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-4-plus
    api_key_env: ZHIPU_API_KEY
  glm-4-flash:
    provider: zhipu
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-4-flash
    api_key_env: ZHIPU_API_KEY
agent_models:
  parser: glm-4-plus
  analyzer: glm-4-plus
  synthesizer: glm-4-plus
  generator: glm-4-plus
  reviewer: glm-4-plus
  outline: deepseek-chat
  writer: deepseek-chat
  citation: glm-4-flash
  polish: glm-4-plus
pipeline:
  max_review_retries: 2
  output_dir: ./output
paper:
  output_dir: ./output/papers
  max_section_tokens: 8192
knowledge_base:
  db_path: ./knowledge_base/research.db
api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
  - http://localhost:5173
  - http://localhost:3000
  upload_dir: ./uploads
  max_upload_size: 52428800
