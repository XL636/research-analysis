[project]
name = "research-analysis"
version = "0.1.0"
description = "研讨会/组会分析工具 - 从研究材料自动生成组会报告和结构化知识库"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "loguru>=0.7",
    "PyMuPDF>=1.24",
    "python-pptx>=0.6",
    "python-docx>=1.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
docx = ["python-docx>=0.8"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
pdf = ["weasyprint>=61", "markdown2>=2.4"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
research-analysis = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=9.0.2",
    "respx>=0.22",
    "ruff>=0.15.2",
]

[tool.pytest.ini_options]
markers = [
    "smoke: 真实 HTTP 冒烟测试（需网络，用 -m smoke 运行）",
    "e2e: 浏览器端到端测试（需运行中的应用）",
]
addopts = "-m 'not smoke and not e2e'"
