[project]
name = "research-analysis"
version = "0.1.0"
description = "研讨会/组会分析工具 - 从研究材料自动生成组会报告和结构化知识库"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "loguru>=0.7",
    "PyMuPDF>=1.24",
    "python-pptx>=0.6",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.0"]
docx = ["python-docx>=0.8"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
research-analysis = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]
